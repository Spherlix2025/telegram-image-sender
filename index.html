<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Spherlix | Telegram Image Uploader</title>
</head>
<body style="background:black;color:white;text-align:center;padding:30px;font-family:sans-serif">
  <h2>Загрузить картинку в Telegram</h2>
  <input type="file" id="imageInput" accept="image/*" />
  <br><br>
  <img id="preview" style="max-width:100%;max-height:300px;border-radius:16px;display:none" />
  <p id="status"></p>

  <script>
    const input = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    input.addEventListener("change", async () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(",")[1];
        preview.src = reader.result;
        preview.style.display = "block";
        status.textContent = "Отправка...";
        try {
          const res = await fetch("/api/send", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              imageBase64: base64,
              caption: "Spherlix тестовая картинка"
            }),
          });
          const data = await res.json();
          status.textContent = data.success ? "Готово!" : "Ошибка: " + data.error;
        } catch (e) {
          status.textContent = "Ошибка сети";
        }
      };
      reader.readAsDataURL(file);
    });
  </script>
</body>
</html>
