
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Отправка изображения в Telegram</title>
</head>
<body style="background:#111; color:#fff; font-family:sans-serif; padding:40px">
  <h2>Форма отправки изображения</h2>

  <form id="sendForm">
    <label>Ссылка на изображение:</label><br>
    <input type="text" name="imageUrl" style="width:100%" value="https://example.com/test.png" required><br><br>

    <label>Описание:</label><br>
    <input type="text" name="caption" style="width:100%" value="Тестовая картинка" required><br><br>

    <label>Telegram chat ID:</label><br>
    <input type="text" name="chatId" style="width:100%" value="885250652" required><br><br>

    <button type="submit">Отправить</button>
  </form>

  <div id="result" style="margin-top:20px;"></div>

  <script>
    document.getElementById('sendForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = {
        imageUrl: this.imageUrl.value,
        caption: this.caption.value,
        chatId: this.chatId.value
      };

      const response = await fetch('https://telegram-image-sender.onrender.com/send-image', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });

      const result = await response.json();
      document.getElementById('result').innerText = JSON.stringify(result, null, 2);
    });
  </script>
</body>
</html>
